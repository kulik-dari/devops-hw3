version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=djangodb
      - POSTGRES_USER=djangoadmin
      - POSTGRES_PASSWORD=DevOpsSecret123!
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=djangodb
      - POSTGRES_USER=djangoadmin
      - POSTGRES_PASSWORD=DevOpsSecret123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
